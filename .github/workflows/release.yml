name: Rilis

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # rpmbuild wajib untuk target rpm. fpm diunduh electron-builder sendiri,
      # jadi Ruby tidak perlu dipasang.
      - name: Prasyarat sistem
        run: sudo apt-get update && sudo apt-get install -y rpm xz-utils

      - name: Cache unduhan Electron
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - run: npm ci

      # Golden test byte adalah mekanisme kebenaran utama proyek ini karena
      # galat protokol gagal senyap. Membangun paket dari kode yang tidak lulus
      # test berarti mendistribusikan sesuatu yang mungkin mengirim byte salah
      # ke hardware yang tidak bisa dibaca balik.
      - run: npm test

      # I2: electron/main.ts sebelumnya tidak pernah ditarik oleh `tsc --noEmit`
      # polos (yang cuma memuat electron/lib/*.ts lewat berkas test) maupun oleh
      # esbuild (yang membuang tipe tanpa memeriksanya). Suntingan yang merusak
      # main.ts tetap terkompilasi jadi JS jalan, 218 test lulus, CI hijau, dan
      # biner terbit dengan proses main yang salah. tsconfig.electron.json
      # mencakup seluruh electron/**/*.ts, termasuk main.ts.
      - run: npm run typecheck:electron

      - run: npm run build
      - run: npm run build:electron

      # fpm menyalin mode berkas sumber apa adanya; git tidak menyimpan mode
      # selain bit eksekusi, jadi mode ditetapkan ulang di sini.
      - name: Tetapkan mode berkas paket
        run: |
          chmod 0644 build/70-gt65.rules
          chmod 0755 build/linux-after-install.sh build/linux-after-remove.sh

      # PENTING: JANGAN tambahkan nama target di CLI (mis. "--linux deb
      # AppImage"). Memanggil electron-builder dengan nama target di CLI
      # tidak mewarisi array `arch` per-target dari electron-builder.yml —
      # hasilnya cuma x64. Dibuktikan lokal: "--linux --publish never" polos
      # (tanpa nama target) menghasilkan AppImage x64+arm64 dan deb x64+arm64
      # dari konfigurasi YAML, sesuai yang diharapkan.
      - run: npx electron-builder --linux --publish never

      # I1: tanpa ini, target yang gagal terbangun diam-diam (mis. arm64) tidak
      # menggagalkan job — glob unggahan di langkah "Terbitkan rilis" cocok
      # dengan apa pun yang kebetulan ada, jadi rilis bisa terbit dengan
      # artefak kurang tanpa ada yang tahu. Jumlah berikut mengikuti matriks
      # `linux.target` di electron-builder.yml: deb x64+arm64, AppImage
      # x64+arm64, rpm x64 saja.
      - name: Verifikasi jumlah artefak
        run: |
          set -euo pipefail
          test "$(ls release/*.deb | wc -l)" -eq 2
          test "$(ls release/*.AppImage | wc -l)" -eq 2
          test "$(ls release/*.rpm | wc -l)" -eq 1
          echo "Jumlah artefak terverifikasi: 2 deb, 2 AppImage, 1 rpm."

      - name: Verifikasi isi paket
        run: |
          set -euo pipefail

          # Daftar isi ditulis ke berkas lebih dulu, TIDAK disalurkan langsung
          # ke `grep -q`. `grep -q` keluar pada kecocokan pertama dan menutup
          # pipa, lalu subproses tar milik dpkg-deb kena EPIPE saat menulis
          # sisa ~95 MB dan gagal dengan "tar: stdout: write error". Dengan
          # `set -o pipefail` itu menjatuhkan seluruh langkah, padahal
          # paketnya sendiri baik-baik saja. Terjadi sungguhan pada tag v0.1.0
          # pertama; jangan kembalikan ke bentuk pipa.
          mkdir -p /tmp/pkgcheck
          for arch in amd64 arm64; do
            deb=$(ls release/gt65-configurator_*_"$arch".deb)
            dpkg-deb -c "$deb" > "/tmp/pkgcheck/$arch.list"
            dpkg-deb -f "$deb" Depends > "/tmp/pkgcheck/$arch.depends"

            grep -q 'usr/lib/udev/rules.d/70-gt65.rules' "/tmp/pkgcheck/$arch.list"
            grep -q 'usr/share/metainfo/' "/tmp/pkgcheck/$arch.list"
            grep -q 'usr/share/applications/gt65-configurator.desktop' "/tmp/pkgcheck/$arch.list"
            grep -q 'libasound2 (>= 1.0.16)' "/tmp/pkgcheck/$arch.depends"

            # Aturan udev harus 0644. fpm menyalin mode sumber apa adanya, jadi
            # umask runner bisa membuatnya 0664 tanpa memicu galat apa pun.
            mode=$(awk '/usr\/lib\/udev\/rules.d\/70-gt65.rules/ {print $1}' "/tmp/pkgcheck/$arch.list")
            test "$mode" = "-rw-r--r--" || {
              echo "Mode aturan udev pada $arch salah: $mode (harus -rw-r--r--)" >&2
              exit 1
            }
            echo "deb $arch: isi terverifikasi (udev $mode)"
          done

          rpm -qlp release/gt65-configurator-*.x86_64.rpm > /tmp/pkgcheck/rpm.list
          grep -q '70-gt65.rules' /tmp/pkgcheck/rpm.list
          grep -q 'metainfo' /tmp/pkgcheck/rpm.list
          echo "rpm x86_64: isi terverifikasi"

          echo "Isi paket terverifikasi."

      - name: Hitung checksum
        working-directory: release
        run: |
          cp ../build/70-gt65.rules .
          sha256sum *.AppImage *.deb *.rpm 70-gt65.rules > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Terbitkan rilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --prerelease \
            --notes-file .github/RELEASE_NOTES.md \
            release/*.AppImage release/*.deb release/*.rpm \
            release/70-gt65.rules release/SHA256SUMS.txt
