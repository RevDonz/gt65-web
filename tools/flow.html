<!doctype html>
<html lang="id">
<meta charset="utf-8">
<title>GT65 — uji variasi alur</title>
<style>
  body{font:14px/1.55 ui-monospace,Menlo,Consolas,monospace;margin:0;padding:24px;
       background:#12171d;color:#e6ebf0}
  h1{font:600 18px/1.3 system-ui,sans-serif;margin:0 0 4px}
  p.sub{color:#7b8794;font-family:system-ui,sans-serif;margin:0 0 16px;max-width:74ch}
  fieldset{border:1px solid #2b343e;border-radius:4px;margin:0 0 14px;padding:12px 14px}
  legend{font:600 12px system-ui,sans-serif;color:#e0904f;padding:0 6px}
  label{font-family:system-ui,sans-serif;display:inline-block;margin:0 16px 6px 0}
  input[type=number]{width:64px;background:#212932;color:#e6ebf0;border:1px solid #3a4653;
                     border-radius:3px;padding:3px 6px;font-family:inherit}
  button{font:600 13px system-ui,sans-serif;padding:10px 18px;margin:0 8px 12px 0;
         border:1px solid #e0904f;background:#e0904f;color:#12171d;border-radius:4px;cursor:pointer}
  #out{white-space:pre-wrap;background:#191f26;border:1px solid #2b343e;border-radius:4px;
       padding:14px;overflow-x:auto;max-height:320px;overflow-y:auto}
  .ok{color:#4fae9d}.bad{color:#d9686c}.hi{color:#e0904f}
</style>

<h1>Uji variasi alur pencahayaan</h1>
<p class="sub">
Penyapuan nilai sudah habis — semua mode 0–31 dengan berbagai colortype, speed, dan
brightness hanya menghasilkan kedipan. Halaman ini menguji <strong>bentuk transaksinya</strong>,
bukan angkanya. Pulihkan kapan saja dengan <code>Fn + \</code>.
</p>

<fieldset>
  <legend>variasi alur</legend>
  <label><input type="checkbox" id="init"> kirim init <code>04 19</code> + <code>04 15</code> lebih dulu</label><br>
  <label><input type="checkbox" id="nof0"> <strong>tanpa</strong> <code>04 f0</code> di akhir (seperti transaksi pengaturan)</label><br>
  <label><input type="checkbox" id="noopen"> tanpa <code>04 18</code> di awal</label><br>
  <label><input type="checkbox" id="twice"> kirim transaksi dua kali</label>
</fieldset>

<fieldset>
  <legend>isi paket data</legend>
  <label>mode <input type="number" id="mode" value="1" min="0" max="255"></label>
  <label>R <input type="number" id="r" value="255" min="0" max="255"></label>
  <label>G <input type="number" id="g" value="255" min="0" max="255"></label>
  <label>B <input type="number" id="b" value="255" min="0" max="255"></label><br>
  <label>byte[8] <input type="number" id="b8" value="0" min="0" max="255"></label>
  <label>byte[9] <input type="number" id="b9" value="3" min="0" max="255"></label>
  <label>byte[10] <input type="number" id="b10" value="3" min="0" max="255"></label>
  <label>byte[11] <input type="number" id="b11" value="0" min="0" max="255"></label>
  <label>jeda ms <input type="number" id="gap" value="1" min="1" max="200"></label>
</fieldset>

<button id="go">Kirim</button>
<div id="out">Belum dijalankan.</div>

<script>
const out = document.getElementById('out');
const L = (s = '', c = '') => { const d = document.createElement('div'); if (c) d.className = c; d.textContent = s; out.appendChild(d); };
const hex = a => [...a].map(b => b.toString(16).padStart(2, '0')).join(' ');
const V = id => +document.getElementById(id).value;
const C = id => document.getElementById(id).checked;

function cmd(op, f = {}) { const p = new Uint8Array(64); p[0] = 0x04; p[1] = op; for (const k of Object.keys(f)) p[+k] = f[k]; return p; }
function dataPkt(f, t) { const p = new Uint8Array(64); for (const k of Object.keys(f)) p[+k] = f[k]; p[t] = 0xaa; p[t + 1] = 0x55; return p; }
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function open_() {
  const ds = await navigator.hid.requestDevice({ filters: [{ vendorId: 0x05ac, productId: 0x024f }] });
  const dev = ds.find(d => (d.collections ?? []).some(c =>
    (c.featureReports ?? []).some(r =>
      (r.items ?? []).reduce((n, it) => n + (it.reportSize ?? 0) * (it.reportCount ?? 0), 0) >= 480)));
  if (!dev) throw new Error('interface konfigurasi tidak ditemukan');
  if (!dev.opened) await dev.open();
  return dev;
}

async function fire(dev, pkts, label, gap) {
  L(`  ${label} — ${pkts.length} paket`, 'hi');
  for (const p of pkts) {
    L('    ' + hex(p.slice(0, 16)));
    await dev.sendFeatureReport(0, p);
    await sleep(gap);
  }
  const v = await dev.receiveFeatureReport(0);
  const back = new Uint8Array(v.buffer, v.byteOffset, v.byteLength);
  const ok = hex(back) === hex(pkts[pkts.length - 1]);
  L(`    echo ${ok ? 'COCOK' : 'BEDA: ' + hex(back.slice(0, 16))}`, ok ? 'ok' : 'bad');
}

document.getElementById('go').onclick = async () => {
  out.textContent = '';
  const gap = V('gap');
  let dev;
  try { dev = await open_(); } catch (e) { L('Gagal membuka: ' + e.message, 'bad'); return; }
  try {
    if (C('init')) {
      await fire(dev, [cmd(0x19), cmd(0x15), new Uint8Array(64), cmd(0x02)], 'init 04 19 / 04 15', gap);
      L('');
    }
    const body = [];
    if (!C('noopen')) body.push(cmd(0x18));
    body.push(cmd(0x13, { 8: 1 }));
    body.push(dataPkt({ 0: V('mode'), 1: V('r'), 2: V('g'), 3: V('b'),
                        8: V('b8'), 9: V('b9'), 10: V('b10'), 11: V('b11') }, 14));
    body.push(cmd(0x02));
    if (!C('nof0')) body.push(cmd(0xf0));

    await fire(dev, body, 'transaksi lampu', gap);
    if (C('twice')) { L(''); await fire(dev, body, 'transaksi lampu (ulang)', gap); }

    L('');
    L('Selesai — lihat keyboardnya.', 'ok');
  } catch (e) { L('ERROR: ' + e.message, 'bad'); }
  finally { try { await dev.close(); } catch {} }
};
</script>
