<!doctype html>
<html lang="id">
<meta charset="utf-8">
<title>GT65 — baca status per paket</title>
<style>
  body{font:14px/1.55 ui-monospace,Menlo,Consolas,monospace;margin:0;padding:24px;
       background:#12171d;color:#e6ebf0}
  h1{font:600 18px/1.3 system-ui,sans-serif;margin:0 0 4px}
  p.sub{color:#7b8794;font-family:system-ui,sans-serif;margin:0 0 16px;max-width:76ch}
  button{font:600 13px system-ui,sans-serif;padding:10px 18px;margin:0 8px 12px 0;
         border:1px solid #e0904f;background:#e0904f;color:#12171d;border-radius:4px;cursor:pointer}
  button.g{background:#212932;color:#e6ebf0;border-color:#3a4653}
  table{border-collapse:collapse;width:100%;margin-top:12px;font-size:13px}
  th,td{border-bottom:1px solid #2b343e;padding:7px 10px;text-align:left}
  th{color:#7b8794;font-family:system-ui,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .ok{color:#4fae9d;font-weight:600}.bad{color:#d9686c;font-weight:600}
  #out{margin-top:8px}
</style>

<h1>Baca byte status setelah tiap paket</h1>
<p class="sub">
Perangkat menulis balik ke <code>payload[3]</code> pada laporan yang kita baca —
<code>04 02</code> kembali sebagai <code>04 02 00 <strong>01</strong></code>.
Halaman ini mengirim tiap paket lalu langsung membacanya, sehingga terlihat perintah
mana yang dijawab <code>01</code> dan mana yang <code>00</code>. Tidak perlu melihat lampu.
</p>

<button id="light">Transaksi lampu</button>
<button class="g" id="probe">Semua opcode satu per satu</button>
<div id="out"></div>

<script>
const out = document.getElementById('out');
const hex = a => [...a].map(b => b.toString(16).padStart(2, '0')).join(' ');
function cmd(op, f = {}) { const p = new Uint8Array(64); p[0] = 0x04; p[1] = op; for (const k of Object.keys(f)) p[+k] = f[k]; return p; }
function dataPkt(f, t) { const p = new Uint8Array(64); for (const k of Object.keys(f)) p[+k] = f[k]; p[t] = 0xaa; p[t + 1] = 0x55; return p; }
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function open_() {
  const ds = await navigator.hid.requestDevice({ filters: [{ vendorId: 0x05ac, productId: 0x024f }] });
  const dev = ds.find(d => (d.collections ?? []).some(c =>
    (c.featureReports ?? []).some(r =>
      (r.items ?? []).reduce((n, it) => n + (it.reportSize ?? 0) * (it.reportCount ?? 0), 0) >= 480)));
  if (!dev) throw new Error('interface konfigurasi tidak ditemukan');
  if (!dev.opened) await dev.open();
  return dev;
}

function table(rows) {
  const t = document.createElement('table');
  t.innerHTML = '<tr><th>#</th><th>dikirim</th><th>dibaca balik</th><th>byte[3]</th><th>byte lain berubah</th></tr>';
  for (const r of rows) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r.i}</td><td>${r.sent}</td><td>${r.got}</td>` +
      `<td class="${r.ack === 1 ? 'ok' : 'bad'}">${r.ack}</td><td>${r.diff}</td>`;
    t.appendChild(tr);
  }
  out.appendChild(t);
}

async function run(pkts, title) {
  out.textContent = '';
  const h = document.createElement('div'); h.textContent = title; out.appendChild(h);
  let dev;
  try { dev = await open_(); } catch (e) { out.textContent = 'Gagal membuka: ' + e.message; return; }
  const rows = [];
  try {
    for (let i = 0; i < pkts.length; i++) {
      const p = pkts[i];
      await dev.sendFeatureReport(0, p);
      await sleep(3);
      const v = await dev.receiveFeatureReport(0);
      const back = new Uint8Array(v.buffer, v.byteOffset, v.byteLength);
      const diff = [];
      for (let k = 0; k < 64; k++) if (back[k] !== p[k] && k !== 3) diff.push(`[${k}]=${back[k].toString(16).padStart(2, '0')}`);
      rows.push({ i: i + 1, sent: hex(p.slice(0, 6)), got: hex(back.slice(0, 6)),
                  ack: back[3], diff: diff.slice(0, 6).join(' ') || '—' });
      await sleep(3);
    }
  } catch (e) { out.appendChild(Object.assign(document.createElement('div'), { textContent: 'ERROR: ' + e.message })); }
  finally { try { await dev.close(); } catch {} }
  table(rows);
}

document.getElementById('light').onclick = () => run([
  cmd(0x18),
  cmd(0x13, { 8: 1 }),
  dataPkt({ 0: 1, 1: 0xff, 2: 0xff, 3: 0xff, 8: 0, 9: 3, 10: 3, 11: 0 }, 14),
  cmd(0x02),
  cmd(0xf0),
], 'Transaksi lampu — status tiap paket');

document.getElementById('probe').onclick = () => run(
  [0x18, 0x02, 0xf0, 0x11, 0x13, 0x15, 0x17, 0x19, 0x20, 0x23, 0x27, 0xf5].map(op => cmd(op)),
  'Tiap opcode dikirim sendiri — mana yang dijawab 01?');
</script>
